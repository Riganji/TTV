name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Постоянный ключ подписи: без него каждый прогон подписывает APK новым
      # ключом и установка поверх старой версии не проходит.
      # Секреты: KEYSTORE_BASE64 (base64 от .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Если секретов нет — создаётся ключ по умолчанию (только для первой установки).
      - name: Подготовить keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/app.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/app.jks" \
              -alias teliktv -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass teliktv -keypass teliktv -dname "CN=TelikTV, O=TelikTV, C=RU"
            echo "::warning::KEYSTORE_BASE64 не задан — APK подписан временным ключом, обновление поверх не встанет."
            echo "KEYSTORE_PASSWORD=teliktv" >> $GITHUB_ENV
            echo "KEY_ALIAS=teliktv" >> $GITHUB_ENV
            echo "KEY_PASSWORD=teliktv" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/app.jks" >> $GITHUB_ENV

      - run: gradle :app:assembleRelease

      - name: Проверить, что APK подписан и читается
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: TelikTV-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          compression-level: 0

      - name: Unit tests (не блокируют APK)
        run: gradle :app:testDebugUnitTest
        continue-on-error: true
