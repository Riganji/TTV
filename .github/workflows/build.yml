name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Постоянный ключ подписи: без него каждый прогон подписывает APK новым
      # ключом и установка поверх старой версии (в том числе через встроенное
      # обновление) не проходит.
      # Ключ берётся из teliktv.jks в репозитории; если его нет — из секрета
      # KEYSTORE_BASE64; если нет и его — создаётся временный (только для первой установки).
      # Пароли: секреты KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Подготовить keystore
        run: |
          if [ -f teliktv.jks ]; then
            cp teliktv.jks "$RUNNER_TEMP/app.jks"
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/app.jks"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/app.jks" \
              -alias teliktv -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass teliktv -keypass teliktv -dname "CN=TelikTV, O=TelikTV, C=RU"
            echo "::warning::Нет ни teliktv.jks, ни KEYSTORE_BASE64 — APK подписан временным ключом, обновление поверх не встанет."
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/app.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'teliktv' }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'teliktv' }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'teliktv' }}" >> $GITHUB_ENV

      # UPDATE_REPO/UPDATE_TOKEN зашиваются в BuildConfig: токен нужен, только если
      # репозиторий с релизами приватный (переменная UPDATE_REPO, секрет UPDATE_TOKEN).
      - name: Собрать release APK
        env:
          UPDATE_REPO: ${{ vars.UPDATE_REPO }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: gradle :app:assembleRelease

      - name: Проверить, что APK подписан и читается
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: TelikTV-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          compression-level: 0

      - name: Unit tests (не блокируют APK)
        run: gradle :app:testDebugUnitTest
        continue-on-error: true
